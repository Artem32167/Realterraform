# -----------------------------
# pipelines/artifacts.yml
# -----------------------------
name: ArtefactsTab

# Manual only
trigger: none
pr: none

variables:
  TF_DIR: '.'
  TF_BACKEND: 'backend/prod.backend.hcl'   # must contain use_azuread_auth=true etc.
  TF_VARS: 'env/prod.tfvars'
  TF_PLAN_FILE: 'tfplan'

pool:
  name: 'my pool'

steps:
- checkout: self

# Tools (avoid the Node10 warning by installing TF yourself if you prefer)
- task: TerraformInstaller@0
  inputs:
    terraformVersion: '1.13.3'

# Azure login (OIDC)
- task: AzureCLI@2
  displayName: "Azure login (OIDC) + plan"
  inputs:
    azureSubscription: 'AzureSP-Dev2'        # your service connection
    addSpnToEnvironment: true
    scriptType: bash
    scriptLocation: inlineScript
    workingDirectory: '$(TF_DIR)'
    inlineScript: |
      set -eo pipefail

      # OIDC env for azurerm provider
      export ARM_USE_OIDC=true
      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$subscriptionId"

      terraform -version

      # IMPORTANT: use the backend config file so init can auth to state
      if [ -f "$(TF_BACKEND)" ]; then
        terraform init -input=false -reconfigure -backend-config="$(TF_BACKEND)"
      else
        terraform init -input=false
      fi

      # Create the plan
      if [ -f "$(TF_VARS)" ]; then
        terraform plan -input=false -no-color -out "$(TF_PLAN_FILE)" -var-file="$(TF_VARS)"
      else
        terraform plan -input=false -no-color -out "$(TF_PLAN_FILE)"
      fi

      # Optional: make a readable JSON version
      terraform show -json "$(TF_PLAN_FILE)" > tfplan.json

# Publish only the plan files as a Pipeline Artifact
- task: PublishPipelineArtifact@1
  displayName: "Publish plan artifact"
  inputs:
    targetPath: '$(TF_DIR)'               # root of the files to publish
    artifact: 'terraform-plan'
    publishLocation: 'pipeline'
    # Include only wanted files using a simple layout:
    # If you want to limit to the files, switch to:
    # targetPath: '$(TF_DIR)'
    # and ensure only tfplan / tfplan.json are present there,
    # or publish exact files with this alternative:
    # - publish: '$(TF_DIR)/tfplan'
    #   artifact: terraform-plan
    # - publish: '$(TF_DIR)/tfplan.json'
    #   artifact: terraform-plan-json