name: Terraform PR Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - 'backend/**'
      - '.tflint.hcl'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ----------------------------
  # 1) Lint: TFLint (blocks PR)
  # ----------------------------
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint init (download rules)
        run: tflint --init

      - name: Run TFLint (fail on findings)
        run: tflint --format compact --recursive

  # ---------------------------------------
  # 2) Plan: state-aware (uses remote state)
  # ---------------------------------------
  plan:
    name: Terraform Plan (state-aware)
    runs-on: ubuntu-latest
    needs: tflint   # <-- require lint to pass before plan
    env:
      ARM_TENANT_ID:        ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID:  ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID:        ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:    ${{ secrets.ARM_CLIENT_SECRET }}
      TF_INPUT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Debug tree
        run: |
          pwd
          ls -la
          ls -la backend || true
          ls -la env || true

      - name: Terraform init (remote backend)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config=backend/dev.backend.hcl

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan (state-aware)
        id: plan
        shell: bash
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock=true \
            -detailed-exitcode \
            -var-file=env/dev.tfvars \
            | tee plan.txt
          ec=$?
          { echo 'PLAN<<EOF'; cat plan.txt; echo EOF; } >> "$GITHUB_OUTPUT"
          if [ $ec -eq 1 ]; then exit 1; fi

      - name: Comment plan to PR (sticky)
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.PLAN }}
        with:
          script: |
            const body = [
              '## Terraform Plan (state-aware, remote backend)',
              '',
              '```txt',
              process.env.PLAN || '(no output)',
              '```',
              '',
              '_Used AzureRM backend with repo secrets (ARM_*). No apply was performed._'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = 'Terraform Plan (state-aware, remote backend)';
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }