name: Terraform Plan (PR)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Prepare temp working dir
        run: |
          rm -rf /tmp/tf && mkdir -p /tmp/tf
          rsync -a --exclude='.git' . /tmp/tf/

      - name: Terraform fmt (check)
        working-directory: /tmp/tf
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: /tmp/tf
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        working-directory: /tmp/tf
        run: terraform validate -no-color

      - name: Terraform plan (speculative)
        id: plan
        working-directory: /tmp/tf
        shell: bash
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock=false \
            -var-file=env/prod.tfvars | tee /tmp/plan.txt
          {
            echo 'PLAN<<EOF'
            cat /tmp/plan.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.PLAN }}
        with:
          script: |
            const body = [
              '## Terraform Plan (speculative, no backend)',
              '',
              '```txt',
              process.env.PLAN || '(no output)',
              '```',
              '',
              '_Note: PR plan runs without any backend and does not touch real state._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });