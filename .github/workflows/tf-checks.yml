name: Terraform Plan (PR)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write  # needed to post a PR comment

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Optional: fast hygiene before planning
      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init (speculative; no backend)
        run: terraform init -backend=false -input=false

      # Pick your default env file for PR previews (e.g., dev)
      - name: Terraform plan (speculative)
        id: tfplan
        run: |
          set -e
          # capture stdout for PR comment
          PLAN_OUTPUT=$(terraform plan -no-color -input=false -var-file=env/prod.tfvars || true)
          echo "PLAN<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          # exit non-zero if plan failed for real (syntax, provider, etc.)
          terraform validate

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Terraform Plan (speculative, no backend)',
              '',
              '```txt',
              process.env.PLAN,
              '```',
              '',
              '_Note: this PR plan runs without the remote backend for speed/safety. We will upgrade to backend + OIDC for real state-aware diffs._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
        env:
          PLAN: ${{ steps.tfplan.outputs.PLAN }}