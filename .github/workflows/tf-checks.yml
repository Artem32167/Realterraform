name: Terraform Plan (PR)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # Make a temp working dir and swap backend to local for this PR run
      - name: Prepare temp working dir (local backend)
        run: |
          rm -rf /tmp/tf && mkdir -p /tmp/tf
          rsync -a --exclude='.git' . /tmp/tf/
          # remove real backend file if present
          rm -f /tmp/tf/backend.tf
          # write local backend
          cat > /tmp/tf/backend.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF

      - name: Terraform fmt (check)
        working-directory: /tmp/tf
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: /tmp/tf
        run: terraform init -input=false -reconfigure

      - name: Terraform validate
        working-directory: /tmp/tf
        run: terraform validate -no-color

      - name: Terraform plan (speculative)
        id: plan
        working-directory: /tmp/tf
        shell: bash
        run: |
          set -o pipefail
          terraform plan -no-color -input=false \
            -lock=false \
            # -var-file=env/dev.tfvars \
            | tee /tmp/plan.txt
          # expose for next step
          {
            echo 'PLAN<<EOF'
            cat /tmp/plan.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Terraform Plan (speculative, local backend)',
              '',
              '```txt',
              process.env.PLAN || '(no output)',
              '```',
              '',
              '_Note: PR plan uses a local backend and does not touch real state._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
        env:
          PLAN: ${{ steps.plan.outputs.PLAN }}