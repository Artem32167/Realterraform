name: Terraform Plan (PR)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -input=false -reconfigure -backend=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan (speculative)
        id: plan
        shell: bash
        run: |
          set -o pipefail
          terraform plan -no-color -input=false \
            -lock=false \
            -detailed-exitcode \
            -var-file=env/prod.tfvars \
            | tee /tmp/plan.txt
          ec=$?
          # expose plan text for next step
          {
            echo 'PLAN<<EOF'
            cat /tmp/plan.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
          # exit with failure only on real error (1)
          if [ $ec -eq 1 ]; then
            exit 1
          fi

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Terraform Plan (speculative, no remote backend)',
              '',
              '```txt',
              process.env.PLAN || '(no output)',
              '```',
              '',
              '_Note: PR plan disables backends and does not touch real state._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
        env:
          PLAN: ${{ steps.plan.outputs.PLAN }}