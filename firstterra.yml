- task: AzureCLI@2
  displayName: "Azure login + Terraform init/plan (OIDC)"
  inputs:
    azureSubscription: 'AzureSP-Dev2'     # your existing SC (federated/OIDC)
    addSpnToEnvironment: true             # gives servicePrincipalId, tenantId, subscriptionId
    scriptType: bash
    scriptLocation: inlineScript
    workingDirectory: '$(TF_DIR)'
    # NOTE: don't use `set -u` here since some vars won't exist in OIDC mode
    inlineScript: |
      set -eo pipefail

      # OIDC for Terraform
      export ARM_USE_OIDC=true
      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$subscriptionId"

      az account show --output table || true
      terraform -version

      if [ -f "$(TF_BACKEND)" ]; then
        terraform init -input=false -reconfigure -backend-config="$(TF_BACKEND)"
      else
        terraform init -input=false
      fi

      if [ -f "$(TF_VARS)" ]; then
        terraform plan -input=false -no-color -lock=false -var-file="$(TF_VARS)"
      else
        terraform plan -input=false -no-color -lock=false
      fi