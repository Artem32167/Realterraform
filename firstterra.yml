# Disable CI trigger
trigger: none

# Disable PR trigger
pr: none

pool:
  name: 'my pool'

variables:
  TF_DIR: '.'
  TF_BACKEND: 'backend/prod.backend.hcl'
  TF_VARS: 'env/prod.tfvars'

steps:
- checkout: self

- script: |
    set -e
    sudo apt-get update -y
    sudo apt-get install -y unzip
    if ! command -v az >/dev/null 2>&1; then
      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
    fi
    az version
  displayName: "Ensure unzip & Azure CLI"

- task: TerraformInstaller@0
  displayName: "Install Terraform 1.13.3"
  inputs:
    terraformVersion: '1.13.3'

- task: AzureCLI@2
  displayName: "Azure login (OIDC) + Terraform init/plan"
  inputs:
    azureSubscription: 'AzureSP-Dev2'
    addSpnToEnvironment: true
    scriptType: bash
    scriptLocation: inlineScript
    workingDirectory: '$(TF_DIR)'
    inlineScript: |
      set -eo pipefail

      echo "== Azure context =="
      az account show --output table || true

      # OIDC env for azurerm provider (no client secret)
      export ARM_USE_OIDC=true
      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$subscriptionId"

      terraform -version

      if [ -f "$(TF_BACKEND)" ]; then
        terraform init -input=false -reconfigure -backend-config="$(TF_BACKEND)"
      else
        terraform init -input=false
      fi

      if [ -f "$(TF_VARS)" ]; then
        terraform plan -input=false -no-color -lock=false -var-file="$(TF_VARS)"
      else
        terraform plan -input=false -no-color -lock=false
      fi